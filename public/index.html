<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ALL-THAT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1 class="wordmark">ALL<span>-</span>THAT</h1>
        <span class="subtitle">Every app you run, in one place</span>
      </div>
      <div class="top-actions">
        <span class="checked" id="checked" aria-live="polite">Checking your apps…</span>
        <button class="btn btn-primary" id="refresh" type="button">Check now</button>
        <button class="btn" id="logout" type="button">Sign out</button>
      </div>
    </header>

    <section class="tiles" id="tiles" aria-label="Summary"></section>
    <section class="attention" id="attention" hidden aria-labelledby="attention-title">
      <h2 id="attention-title">Needs attention</h2>
      <ul id="attention-list"></ul>
    </section>

    <section aria-labelledby="apps-title" class="apps">
      <h2 class="section-title" id="apps-title">Apps</h2>
      <div class="cards" id="cards"></div>
    </section>

    <p class="foot" id="foot">Admin links open each app's own panel in a new tab, where you sign in to that app as usual.</p>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
