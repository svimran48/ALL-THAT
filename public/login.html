<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · ALL-THAT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="login-body">
  <form class="login" id="form" autocomplete="on">
    <h1 class="wordmark">ALL<span>-</span>THAT</h1>
    <label for="password">Owner password
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="1" autofocus>
    </label>
    <button class="btn btn-primary" id="submit" type="submit">Sign in</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <script src="/login.js" type="module"></script>
</body>
</html>
